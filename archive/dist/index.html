<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GCA Desktop</title>
<style>
  :root {
    --bg: #0d0d0d; --surface: #1a1a19; --text: #ffffff; --text2: #c3c2b7;
    --text3: #898781; --border: rgba(255,255,255,0.08); --green: #0ca30c;
    --green-bg: #12300f; --yellow: #fab219; --yellow-bg: #3a2e08;
    --red: #e53935; --red-bg: #3a0e0e; --blue: #3987e5; --blue-bg: #0d2137;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  .login-page { flex: 1; display: flex; align-items: center; justify-content: center; }
  .login-box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 32px; width: 380px; }
  .login-box h2 { font-size: 20px; font-weight: 650; margin-bottom: 4px; }
  .login-box .sub { font-size: 12px; color: var(--text3); margin-bottom: 24px; }
  .login-box label { font-size: 12px; color: var(--text2); display: block; margin-bottom: 4px; margin-top: 14px; }
  .login-box input { width: 100%; padding: 9px 12px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; font-size: 13px; outline: none; }
  .login-box input:focus { border-color: var(--blue); }
  .login-box .error { font-size: 12px; color: var(--red); margin-top: 8px; min-height: 18px; }
  .login-box button { width: 100%; padding: 10px; background: var(--blue); color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 20px; }
  .login-box button:hover { opacity: .85; }
  .login-box button:disabled { opacity: .4; cursor: default; }

  #mainApp { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .hidden { display: none !important; }

  header { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  h1 { font-size: 18px; font-weight: 650; }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .server-status { font-size: 12px; color: var(--text3); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.green { background: var(--green); } .dot.red { background: var(--red); }
  .logout-btn { font-size: 11px; padding: 4px 10px; background: transparent; color: var(--text3); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; }
  .logout-btn:hover { color: var(--red); border-color: rgba(229,57,53,.3); }

  .nav { display: flex; gap: 0; padding: 0 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .nav a { padding: 10px 20px; font-size: 13px; color: var(--text3); text-decoration: none; border-bottom: 2px solid transparent; transition: all .15s; cursor: pointer; }
  .nav a:hover { color: var(--text2); }
  .nav a.active { color: var(--text); border-bottom-color: var(--blue); font-weight: 600; }

  .page { flex: 1; overflow: hidden; display: none; flex-direction: column; }
  .page.active { display: flex; }

  .register-banner { padding: 12px 20px; background: var(--yellow-bg); border-bottom: 1px solid rgba(250,178,25,.2); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; position: relative; z-index: 10; }
  .register-banner span { font-size: 13px; color: var(--yellow); }
  .btn { padding: 5px 14px; font-size: 12px; background: var(--surface); color: var(--text2); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; white-space: nowrap; position: relative; z-index: 11; }
  .btn:hover { background: rgba(255,255,255,.06); }
  .btn.green { background: var(--green-bg); color: var(--green); border-color: rgba(12,163,12,.3); }
  .btn.yellow { background: var(--yellow-bg); color: var(--yellow); border-color: rgba(250,178,25,.3); }

  .device-list { flex: 1; overflow-y: auto; padding: 12px 20px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  .card-left { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
  .card-name { font-size: 14px; font-weight: 650; cursor: pointer; padding: 2px 6px; border-radius: 4px; display: inline-block; }
  .card-name:hover { background: rgba(255,255,255,.06); }
  .card-name input { font-size: 14px; font-weight: 650; background: var(--bg); border: 1px solid var(--blue); color: var(--text); border-radius: 4px; padding: 2px 6px; outline: none; width: 180px; }
  .card-url { font-size: 11px; color: var(--text3); font-family: "Cascadia Code","Fira Code",monospace; cursor: pointer; padding: 2px 6px; border-radius: 4px; }
  .card-url:hover { background: rgba(255,255,255,.04); }
  .card-url input { font-size: 11px; background: var(--bg); border: 1px solid var(--blue); color: var(--text2); border-radius: 4px; padding: 2px 6px; outline: none; width: 280px; font-family: "Cascadia Code","Fira Code",monospace; }
  .card-right { display: flex; align-items: center; flex-shrink: 0; margin-left: 12px; }
  .col-tools { width: 50px; text-align: center; flex-shrink: 0; }
  .col-uptime { width: 64px; text-align: center; flex-shrink: 0; }
  .col-actions { width: 48px; text-align: center; flex-shrink: 0; }
  .tool-count { font-size: 22px; font-weight: 700; color: var(--blue); }
  .tool-label { font-size: 10px; color: var(--text3); }
  .status { font-size: 11px; padding: 3px 10px; border-radius: 999px; font-weight: 600; }
  .status.online { color: var(--green); background: var(--green-bg); }
  .status.offline { color: var(--red); background: var(--red-bg); }
  .col-actions button { padding: 4px 10px; font-size: 11px; background: transparent; color: var(--red); border: 1px solid rgba(229,57,53,.3); border-radius: 6px; cursor: pointer; }
  .col-actions button:hover { background: var(--red-bg); }

  .log-toolbar { padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .log-toolbar span { font-size: 13px; font-weight: 600; color: var(--text2); }
  .log-panel { flex: 1; overflow-y: auto; padding: 10px 20px; font-size: 11px; font-family: "Cascadia Code","Fira Code",monospace; }
  .log-panel .log-error { color: var(--red); }
  .log-panel .log-ok { color: var(--green); }
  .log-panel .log-info { color: var(--text3); }
</style>
</head>
<body>

<!-- 登录页 -->
<div class="login-page" id="loginPage">
  <div class="login-box">
    <h2>GCA Desktop</h2>
    <div class="sub">Global Control Assistant · 连接控制服务器</div>
    <label>服务器地址</label>
    <input type="text" id="loginUrl" placeholder="http://<服务器IP>:<端口>">
    <label>密钥 (Token)</label>
    <input type="password" id="loginToken" placeholder="由服务器管理员提供">
    <div class="error" id="loginError"></div>
    <button id="loginBtn">连接</button>
  </div>
</div>

<!-- 主页 -->
<div id="mainApp" class="hidden">
  <header>
    <h1>GCA Desktop</h1>
    <div class="header-right">
      <div class="server-status">
        <span class="dot" id="serverDot"></span>
        <span id="serverText">连接中...</span>
      </div>
      <button class="logout-btn" id="logoutBtn">退出登录</button>
    </div>
  </header>
  <div class="nav">
    <a class="active" data-page="devices">📱 设备</a>
    <a data-page="logs">📋 日志</a>
  </div>

  <div class="page active" id="page-devices">
    <div class="register-banner hidden" id="registerBanner">
      <span></span>
      <button class="btn yellow" id="registerThisBtn" onclick="event.stopPropagation(); window._registerThis()">注册本设备</button>
    </div>
    <div class="device-list" id="deviceList">
      <div class="card" style="justify-content:center;color:var(--text3)">加载中...</div>
    </div>
  </div>

  <div class="page" id="page-logs">
    <div class="log-toolbar">
      <span>运行日志</span>
      <button class="btn" id="clearBtn">清空日志</button>
    </div>
    <div class="log-panel" id="logPanel"></div>
  </div>
</div>

<script type="module">
import { invoke } from './tauri-api/core.js';

let serverUrl = '';
let gcaToken = '';
const logs = [];
let _refreshing = false;
let _localDeviceName = '';
let _registrationSent = false;

// ═══ 登录 ═══
const loginPage = document.getElementById('loginPage');
const mainApp = document.getElementById('mainApp');
const loginUrl = document.getElementById('loginUrl');
const loginToken = document.getElementById('loginToken');
const loginError = document.getElementById('loginError');
const loginBtn = document.getElementById('loginBtn');

loginBtn.addEventListener('click', doLogin);
loginToken.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
loginUrl.addEventListener('keydown', e => { if (e.key === 'Enter') loginToken.focus(); });

async function doLogin() {
  const url = loginUrl.value.trim().replace(/\/+$/, '');
  const token = loginToken.value.trim();
  if (!url) { loginError.textContent = '请输入服务器地址'; return; }
  if (!token) { loginError.textContent = '请输入密钥'; return; }

  loginBtn.disabled = true;
  loginBtn.textContent = '连接中...';
  loginError.textContent = '';

  try {
    let healthBody;
    try { healthBody = await invoke('http_get', { url: `${url}/health`, token }); }
    catch { throw new Error('无法连接服务器，请检查地址'); }
    const healthData = JSON.parse(healthBody);
    if (!healthData.ok) throw new Error('服务器响应异常');

    let devicesBody;
    try { devicesBody = await invoke('http_get', { url: `${url}/devices`, token }); }
    catch { throw new Error('密钥无效或已过期'); }
    const devicesData = JSON.parse(devicesBody);
    if (devicesData.error) throw new Error(devicesData.error);

    serverUrl = url;
    gcaToken = token;
    localStorage.setItem('gca-server-url', url);
    localStorage.setItem('gca-token', token);

    loginPage.classList.add('hidden');
    mainApp.classList.remove('hidden');

    log('登录成功', 'ok');
    refresh();
    setInterval(refresh, 15000);
  } catch (e) {
    loginError.textContent = e.message;
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = '连接';
  }
}

document.getElementById('logoutBtn').addEventListener('click', () => {
  localStorage.removeItem('gca-token');
  localStorage.removeItem('gca-server-url');
  gcaToken = ''; serverUrl = '';
  mainApp.classList.add('hidden');
  loginPage.classList.remove('hidden');
  loginToken.value = '';
  loginError.textContent = '';
});

// ═══ 导航 ═══
document.querySelectorAll('.nav a').forEach(a => {
  a.addEventListener('click', () => {
    document.querySelectorAll('.nav a').forEach(x => x.classList.toggle('active', x === a));
    document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + a.dataset.page));
  });
});

// ═══ 日志 ═══
function log(msg, type='info') {
  const ts = new Date().toLocaleTimeString('zh-CN', {hour12:false});
  logs.push({ts, msg, type});
  if (logs.length > 500) logs.shift();
  const el = document.getElementById('logPanel');
  if (el) { el.innerHTML = logs.slice(-200).map(l => `<div class="log-${l.type}">[${l.ts}] ${l.msg}</div>`).join(''); el.scrollTop = el.scrollHeight; }
}

document.getElementById('clearBtn').addEventListener('click', () => { logs.length = 0; const el = document.getElementById('logPanel'); if (el) el.innerHTML = ''; });

// ═══ HTTP ═══
async function httpGet(url) { return invoke('http_get', { url, token: gcaToken }); }
async function httpPost(url, body) { return invoke('http_post', { url, token: gcaToken, body: JSON.stringify(body) }); }

// ═══ 设备 ═══
function fmtUptime(s) {
  if (!s || s < 0) return '';
  if (s < 60) return s + 's';
  if (s < 3600) return Math.floor(s/60) + 'm';
  if (s < 86400) return Math.floor(s/3600) + 'h' + Math.floor(s%3600/60) + 'm';
  return Math.floor(s/86400) + 'd' + Math.floor(s%86400/3600) + 'h';
}

async function refresh() {
  if (_refreshing) return;
  _refreshing = true;
  const dot = document.getElementById('serverDot');
  const text = document.getElementById('serverText');
  const grid = document.getElementById('deviceList');

  try {
    const body = await httpGet(`${serverUrl}/devices`);
    const data = JSON.parse(body);
    dot.className = 'dot green';
    text.textContent = `gca-server · ${data.count} 设备`;

    const results = await Promise.all(data.devices.map(async d => {
      try {
        const h = await httpGet(d.url.replace('/mcp', '/health'));
        const hd = JSON.parse(h);
        return { ...d, online: hd.status === 'ok', uptime: hd.uptime || 0 };
      } catch { return { ...d, online: false }; }
    }));

    grid.innerHTML = results.map(d => `
      <div class="card">
        <div class="card-left">
          <div class="card-name" data-rename="${d.name}" title="点击重命名">${d.name}</div>
          <div class="card-url" data-reurl="${d.name}" data-url="${d.url}" title="点击修改地址">${d.url}</div>
        </div>
        <div class="card-right">
          <div class="col-tools"><div class="tool-count">${d.online ? '20' : '-'}</div><div class="tool-label">tools</div></div>
          <div class="col-uptime"><div style="font-size:11px;color:var(--text2);height:16px">${fmtUptime(d.uptime)}</div><span class="status ${d.online ? 'online' : 'offline'}">${d.online ? '在线' : '离线'}</span></div>
          <div class="col-actions"><button data-revoke="${d.name}">注销</button></div>
        </div>
      </div>
    `).join('') || '<div class="card" style="justify-content:center;color:var(--text3)">无设备</div>';

    grid.querySelectorAll('[data-rename]').forEach(el => el.addEventListener('click', () => startRename(el, el.dataset.rename)));
    grid.querySelectorAll('[data-reurl]').forEach(el => el.addEventListener('click', () => startReUrl(el, el.dataset.reurl, el.dataset.url)));
    grid.querySelectorAll('[data-revoke]').forEach(el => el.addEventListener('click', () => doRevoke(el.dataset.revoke)));

    // 本设备注册检测
    const banner = document.getElementById('registerBanner');
    // 用主机名构造设备名（和 gca-poc 一致的命名规则）
    const hostname = window.__gca_hostname || 'unknown';
    _localDeviceName = 'gca-' + hostname.toLowerCase().replace(/[^a-z0-9-]/g, '');

    // 尝试从本机 gca-poc 获取实际设备名
    try {
      const lh = await invoke('http_get', { url: 'http://127.0.0.1:3001/health', token: '' });
      const ld = JSON.parse(lh);
      if (ld.device) _localDeviceName = ld.device;
    } catch {}

    // 在服务端设备列表中查找本机（按名称或端口匹配）
    const found = data.devices.find(d =>
      d.name === _localDeviceName || (() => { try { return new URL(d.url).port === '3001'; } catch { return false; } })()
    );

    if (found) {
      _localDeviceName = found.name;
      banner.classList.add('hidden');
      _registrationSent = false;
    } else if (!_registrationSent) {
      banner.classList.remove('hidden');
      banner.querySelector('span').textContent = `⚠ 本设备 "${_localDeviceName}" 尚未注册到控制服务器`;
      banner.querySelector('span').style.color = '';
    }

  } catch (err) {
    dot.className = 'dot red'; text.textContent = '连接失败';
    grid.innerHTML = `<div class="card" style="justify-content:center;color:var(--text3)">${err.message}</div>`;
  } finally { _refreshing = false; }
}

// ═══ 重命名 ═══
function startRename(el, oldName) {
  if (el.querySelector('input')) return;
  const input = document.createElement('input');
  input.value = oldName;
  el.innerHTML = '';
  el.appendChild(input);
  setTimeout(() => { input.focus(); input.select(); }, 10);
  let done = false;
  const save = async () => { if (done) return; done = true; const v = input.value.trim(); if (v && v !== oldName) { try { await httpPost(`${serverUrl}/devices/${encodeURIComponent(oldName)}/rename`, { newName: v }); log(`✓ 重命名: ${oldName} → ${v}`, 'ok'); } catch (e) { log(`✗ ${e}`, 'error'); } } refresh(); };
  input.addEventListener('blur', save);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') input.blur(); if (e.key === 'Escape') { done = true; el.textContent = oldName; } });
}

// ═══ 修改地址 ═══
function startReUrl(el, name, oldUrl) {
  if (el.querySelector('input')) return;
  const input = document.createElement('input');
  input.value = oldUrl;
  el.innerHTML = '';
  el.appendChild(input);
  setTimeout(() => { input.focus(); input.select(); }, 10);
  let done = false;
  const save = async () => { if (done) return; done = true; const v = input.value.trim(); if (v && v !== oldUrl) { try { await httpPost(`${serverUrl}/devices/${encodeURIComponent(name)}/reurl`, { newUrl: v }); log(`✓ 地址: ${name} → ${v}`, 'ok'); } catch (e) { log(`✗ ${e}`, 'error'); } } refresh(); };
  input.addEventListener('blur', save);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') input.blur(); if (e.key === 'Escape') { done = true; el.textContent = oldUrl; } });
}

// ═══ 注销 ═══
async function doRevoke(name) {
  if (!confirm(`确定注销设备 "${name}"？`)) return;
  try { await httpPost(`${serverUrl}/devices/${encodeURIComponent(name)}/revoke`, {}); log(`✓ 已注销: ${name}`, 'ok'); refresh(); } catch (e) { log(`✗ ${e}`, 'error'); }
}

// ═══ 注册本设备 ═══
window._registerThis = async function() {
  const btn = document.getElementById('registerThisBtn');
  const banner = document.getElementById('registerBanner');
  const name = _localDeviceName || 'gca-unknown';
  const origText = btn.textContent;
  btn.textContent = '注册中...';
  btn.disabled = true;
  try {
    const body = await httpPost(`${serverUrl}/register`, { deviceName: name });
    const r = JSON.parse(body);
    if (r.id) {
      _registrationSent = true;
      btn.textContent = '已发送';
      btn.disabled = true;
      banner.querySelector('span').textContent = `✓ 确认码: ${r.code}（5分钟有效），等待管理员审批`;
      banner.querySelector('span').style.color = 'var(--green)';
      log(`✓ 注册请求已发送，确认码: ${r.code}，等待管理员审批`, 'ok');
    } else {
      btn.textContent = origText;
      btn.disabled = false;
      banner.querySelector('span').textContent = `✗ ${r.error || '注册失败'}`;
      log(`✗ ${r.error || '注册失败'}`, 'error');
    }
  } catch (e) {
    btn.textContent = origText;
    btn.disabled = false;
    banner.querySelector('span').textContent = `✗ ${e}`;
    log(`✗ ${e}`, 'error');
  }
};
document.getElementById('registerThisBtn').addEventListener('click', (e) => { e.stopPropagation(); window._registerThis(); });

// ═══ 获取主机名 ═══
try { window.__gca_hostname = await invoke('get_hostname'); } catch {}

// ═══ 自动登录 ═══
const savedToken = localStorage.getItem('gca-token');
const savedUrl = localStorage.getItem('gca-server-url');
if (savedToken && savedUrl) {
  loginUrl.value = savedUrl;
  loginToken.value = savedToken;
  doLogin();
}
</script>
</body>
</html>

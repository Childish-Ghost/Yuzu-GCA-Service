[package]
name = "gca-desktop-rs"
version = "0.5.0"
edition = "2021"
description = "GCA Desktop — Rust 原生客户端（无 Web 前端 / 无 node）"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.31"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 真终端 VT 解析（Alacritty 同款，Apache-2.0 OR MIT）——C-1 方案
vte = "0.15"

